<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="100%" height="100%" fill="none" role="img" aria-label="JobSafe AI Offer Letter Verification Illustration">
  <defs>
    <!-- Purple Gradients -->
    <linearGradient id="offerBgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F5F3FF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="contractPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
    <linearGradient id="offerPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.05"/>
    </linearGradient>
    
    <!-- Filters -->
    <filter id="offerShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.13"/>
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="230" cy="180" r="140" fill="url(#offerBgGlow)"/>

  <!-- Scanning Circuit Grid Trace -->
  <g stroke="#DDD6FE" stroke-width="1.6" stroke-dasharray="5,5" fill="none" opacity="0.7">
    <path d="M 50 180 L 100 180 L 130 220"/>
    <path d="M 410 180 L 360 180 L 330 140"/>
    <path d="M 230 40 L 230 70"/>
    <circle cx="50" cy="180" r="4" fill="#8B5CF6"/>
    <circle cx="410" cy="180" r="4" fill="#8B5CF6"/>
  </g>

  <!-- Employment Offer Letter Document Stack -->
  <g filter="url(#offerShadow)">
    <!-- Back Page (Layering Depth) -->
    <rect x="92" y="55" width="230" height="260" rx="16" fill="#EDE9FE" opacity="0.6" transform="rotate(-3 207 185)"/>
    
    <!-- Primary Offer Letter Sheet -->
    <rect x="100" y="50" width="235" height="265" rx="16" fill="url(#contractPaper)" stroke="#E9D5FF" stroke-width="2"/>

    <!-- Document Header: Corporate Letterhead Bar -->
    <rect x="120" y="70" width="42" height="10" rx="5" fill="#6D28D9"/>
    <rect x="120" y="86" width="130" height="6" rx="3" fill="#A855F7" opacity="0.8"/>
    <rect x="120" y="97" width="80" height="5" rx="2.5" fill="#CBD5E1"/>

    <!-- Formal Divider -->
    <line x1="120" y1="112" x2="310" y2="112" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Offer Clauses / Terms Lines -->
    <g fill="#94A3B8">
      <rect x="120" y="125" width="190" height="6.5" rx="3"/>
      <rect x="120" y="138" width="175" height="6.5" rx="3"/>
      <rect x="120" y="151" width="185" height="6.5" rx="3"/>
      <rect x="120" y="164" width="150" height="6.5" rx="3"/>
    </g>

    <!-- Compensation & Salary Terms Box -->
    <rect x="120" y="180" width="195" height="34" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <circle cx="134" cy="197" r="6" fill="#10B981"/>
    <path d="M 132 197 L 134 199 L 137 195" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="148" y="191" width="95" height="6" rx="3" fill="#5B21B6"/>
    <rect x="148" y="201" width="60" height="5" rx="2.5" fill="#8B5CF6"/>

    <!-- Signature Block & Corporate Wax Seal Ribbon -->
    <g transform="translate(120, 226)">
      <!-- Signature Line -->
      <path d="M 5 28 Q 20 18 35 26 Q 50 15 65 24 Q 75 18 85 22" stroke="#6D28D9" stroke-width="2" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="36" x2="90" y2="36" stroke="#CBD5E1" stroke-width="1.5"/>
      <rect x="0" y="42" width="55" height="5" rx="2.5" fill="#94A3B8"/>
      
      <!-- Official Corporate Seal Stamp -->
      <g transform="translate(135, 12)">
        <circle cx="24" cy="24" r="22" fill="url(#sealGrad)"/>
        <circle cx="24" cy="24" r="18" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,2"/>
        <path d="M 18 24 L 22 28 L 30 19" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Ribbon Tails -->
        <path d="M 16 42 L 10 58 L 22 53 Z" fill="#6D28D9"/>
        <path d="M 32 42 L 38 58 L 26 53 Z" fill="#5B21B6"/>
      </g>
    </g>

    <!-- AI Scan Wave Sweep Across Document -->
    <polygon points="100,120 335,120 335,170 100,170" fill="url(#laserBeamGrad)"/>
    <line x1="100" y1="120" x2="335" y2="120" stroke="#C084FC" stroke-width="2"/>
  </g>

  <!-- Large Verification Security Shield (Floating Right Foreground) -->
  <g filter="url(#badgeGlow)" transform="translate(285, 150)">
    <!-- Heraldic Shield -->
    <path d="M 60 5 
             L 115 25 
             C 115 85, 90 135, 60 160 
             C 30 135, 5 85, 5 25 
             Z" 
          fill="url(#offerPurpleGrad)" stroke="#C084FC" stroke-width="3"/>
    
    <!-- Inner Shield Inset -->
    <path d="M 60 18 
             L 104 34 
             C 104 84, 82 124, 60 144 
             C 38 124, 16 84, 16 34 
             Z" 
          fill="#5B21B6" opacity="0.9"/>
          
    <!-- Shield Division Line -->
    <path d="M 60 18 L 60 144 C 82 124, 104 84, 104 34 Z" fill="#000000" opacity="0.15"/>

    <!-- Verification Checkmark Inside Shield -->
    <circle cx="60" cy="80" r="22" fill="#10B981"/>
    <path d="M 51 80 L 57 86 L 70 73" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Mini Lock Shackle -->
    <rect x="52" y="112" width="16" height="12" rx="3" fill="#DDD6FE"/>
    <path d="M 55 112 L 55 107 C 55 104, 65 104, 65 107 L 65 112" stroke="#DDD6FE" stroke-width="2" fill="none"/>
  </g>

  <!-- Top Floating Status Pill -->
  <g filter="url(#offerShadow)" transform="translate(60, 85)">
    <rect width="130" height="34" rx="17" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="8" fill="#10B981"/>
    <path d="M 15 17 L 17 19 L 21 15" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#1F1633">OFFER VERIFIED</text>
  </g>
</svg>
