<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="100%" height="100%" fill="none" role="img" aria-label="JobSafe AI Fake Job Detection Scanning Illustration">
  <defs>
    <!-- Gradients -->
    <linearGradient id="scanBgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5F3FF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="scanDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
    <linearGradient id="scanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanBeamLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="shieldGradSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    
    <!-- Filters -->
    <filter id="docShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5B21B6" flood-opacity="0.12"/>
    </filter>
    <filter id="lensGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#8B5CF6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="230" cy="180" r="145" fill="url(#scanBgGlow)"/>

  <!-- Scanning Waves (Concentric Radial Arcs) -->
  <g stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="6,6" fill="none" opacity="0.6">
    <circle cx="200" cy="170" r="160"/>
    <circle cx="200" cy="170" r="120"/>
    <circle cx="200" cy="170" r="80"/>
  </g>

  <!-- Central Job Listing Document -->
  <g filter="url(#docShadow)" transform="translate(65, 45)">
    <!-- Main Card Body -->
    <rect width="260" height="270" rx="18" fill="url(#scanDocGrad)" stroke="#DDD6FE" stroke-width="1.8"/>

    <!-- Document Header Banner -->
    <rect x="0" y="0" width="260" height="52" rx="18" fill="#F3E8FF"/>
    <path d="M 0 35 L 260 35 L 260 52 L 0 52 Z" fill="#F3E8FF"/>
    
    <!-- Job Icon Pill -->
    <rect x="18" y="14" width="26" height="24" rx="6" fill="#7C3AED"/>
    <path d="M 26 23 L 36 23 M 28 20 L 34 20 M 26 27 L 36 27" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Job Title Placeholder -->
    <rect x="52" y="16" width="115" height="10" rx="5" fill="#4C1D95"/>
    <rect x="52" y="30" width="75" height="6" rx="3" fill="#8B5CF6"/>

    <!-- Job Status Chip -->
    <rect x="180" y="16" width="62" height="20" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1"/>
    <circle cx="190" cy="26" r="3.5" fill="#10B981"/>
    <text x="198" y="29.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#5B21B6">ACTIVE</text>

    <!-- Document Text Rows -->
    <g fill="#CBD5E1">
      <rect x="20" y="70" width="220" height="7" rx="3.5"/>
      <rect x="20" y="86" width="195" height="7" rx="3.5"/>
      <rect x="20" y="102" width="210" height="7" rx="3.5"/>
      <rect x="20" y="118" width="170" height="7" rx="3.5"/>
      <rect x="20" y="134" width="220" height="7" rx="3.5"/>
    </g>

    <!-- Highlighted Scam Sentence Being Scanned (Under Magnifier Area) -->
    <g>
      <rect x="18" y="150" width="224" height="24" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="26" y="158" width="80" height="8" rx="4" fill="#DC2626"/>
      <rect x="112" y="158" width="75" height="8" rx="4" fill="#EF4444" opacity="0.8"/>
      <rect x="193" y="158" width="40" height="8" rx="4" fill="#DC2626"/>
    </g>

    <!-- Lower Content Rows -->
    <g fill="#E2E8F0">
      <rect x="20" y="186" width="215" height="7" rx="3.5"/>
      <rect x="20" y="202" width="190" height="7" rx="3.5"/>
      <rect x="20" y="218" width="140" height="7" rx="3.5"/>
    </g>

    <!-- Holographic AI Scanning Beam Band Across Document -->
    <rect x="0" y="142" width="260" height="38" fill="url(#scanBeamGrad)"/>
    <line x1="0" y1="161" x2="260" y2="161" stroke="url(#scanBeamLine)" stroke-width="2.5"/>
  </g>

  <!-- Large Glass Magnifying Glass Examining Suspicious Signal -->
  <g filter="url(#lensGlow)">
    <!-- Magnifier Handle -->
    <g transform="rotate(42 270 215)">
      <rect x="335" y="208" width="70" height="14" rx="7" fill="url(#glassRim)"/>
      <rect x="340" y="211" width="60" height="8" rx="4" fill="#4C1D95"/>
      <circle cx="396" cy="215" r="3" fill="#DDD6FE"/>
    </g>

    <!-- Magnifier Lens Ring -->
    <circle cx="265" cy="205" r="58" fill="url(#lensGrad)" stroke="url(#glassRim)" stroke-width="8"/>
    
    <!-- Lens Reflection Arc -->
    <path d="M 230 180 A 46 46 0 0 1 295 172" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 225 194 A 46 46 0 0 1 235 170" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Reticle Target Lines inside Lens -->
    <g stroke="#7C3AED" stroke-width="1.8" opacity="0.7">
      <line x1="265" y1="165" x2="265" y2="180"/>
      <line x1="265" y1="230" x2="265" y2="245"/>
      <line x1="225" y1="205" x2="240" y2="205"/>
      <line x1="290" y1="205" x2="305" y2="205"/>
      <circle cx="265" cy="205" r="16" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="3,3"/>
    </g>

    <!-- Magnified Keyword Icon / Badge inside Lens -->
    <rect x="245" y="196" width="40" height="18" rx="6" fill="#EF4444"/>
    <text x="265" y="209" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">FLAG</text>
  </g>

  <!-- Floating Security Shield Badge (Top Left) -->
  <g filter="url(#docShadow)" transform="translate(30, 80)">
    <path d="M 30 5 L 56 16 C 56 42, 44 64, 30 74 C 16 64, 4 42, 4 16 Z" 
          fill="url(#shieldGradSmall)" stroke="#C084FC" stroke-width="2"/>
    <circle cx="30" cy="38" r="13" fill="#FFFFFF" opacity="0.18"/>
    <path d="M 24 38 L 28 42 L 37 33" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AI Neural Circuit Sparkles -->
  <g fill="#7C3AED">
    <circle cx="50" cy="280" r="3.5"/>
    <circle cx="380" cy="80" r="4"/>
    <circle cx="410" cy="160" r="3"/>
    <line x1="380" y1="80" x2="410" y2="160" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
</svg>
